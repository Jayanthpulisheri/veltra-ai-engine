[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veltra-agent"
version = "0.4.0"
description = "Deterministic guardrail, SIEM audit exporter, and subprocess firewall for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
veltra = "veltra_agent.cli:main"
